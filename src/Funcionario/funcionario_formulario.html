<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário Funcionário</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin-top: 10px; }
        input { padding: 5px; width: 250px; }
        button { margin-top: 15px; padding: 8px 20px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #4a90d9; color: white; }
        .maior { background-color: #ffcccc; }
        .menor { background-color: #ffffaa; }
    </style>
</head>
<body>

<h2>Cadastro de Funcionário</h2>

<label>Nome: <input type="text" id="nome"></label>
<label>Salário Base (R$): <input type="number" id="salario" min="0" step="0.01"></label>
<label>Número de Filhos: <input type="number" id="filhos" min="0" max="10"></label>
<label>Vale Alimentação (R$): <input type="number" id="vale" min="0" step="0.01"></label>

<button onclick="cadastrar()">Cadastrar</button>

<div id="tabela-container"></div>

<script>
    const funcionarios = [];

    function cadastrar() {
        const nome = document.getElementById('nome').value.trim();
        const salarioBase = parseFloat(document.getElementById('salario').value);
        const nroFilhos = parseInt(document.getElementById('filhos').value);
        const valeAlimentacao = parseFloat(document.getElementById('vale').value);

        if (!nome || isNaN(salarioBase) || isNaN(nroFilhos) || isNaN(valeAlimentacao)) {
            alert('Preencha todos os campos corretamente.');
            return;
        }

        const inss = salarioBase * 0.20;
        const salarioFamilia = 100 * Math.min(nroFilhos, 3);
        const salarioTotal = salarioBase + salarioFamilia + valeAlimentacao - inss;
        const descontosTotal = inss;

        funcionarios.push({
            nome,
            salarioBase,
            nroFilhos,
            valeAlimentacao,
            inss,
            salarioFamilia,
            salarioTotal,
            descontosTotal
        });

        document.getElementById('nome').value = '';
        document.getElementById('salario').value = '';
        document.getElementById('filhos').value = '';
        document.getElementById('vale').value = '';

        renderTabela();
    }

    function renderTabela() {
        if (funcionarios.length === 0) return;

        const salarios = funcionarios.map(f => f.salarioBase);
        const maiorSalario = Math.max(...salarios);
        const menorSalario = Math.min(...salarios);

        let html = `
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Salário Base</th>
            <th>Nº Filhos</th>
            <th>Vale Alimentação</th>
            <th>INSS (20%)</th>
            <th>Salário Família</th>
            <th>Salário Total</th>
            <th>Descontos Totais</th>
          </tr>
        </thead>
        <tbody>
    `;

        for (const f of funcionarios) {
            let classe = '';
            if (f.salarioBase === maiorSalario) classe = 'maior';
            else if (f.salarioBase === menorSalario) classe = 'menor';

            html += `
        <tr class="${classe}">
          <td>${f.nome}</td>
          <td>R$ ${f.salarioBase.toFixed(2)}</td>
          <td>${f.nroFilhos}</td>
          <td>R$ ${f.valeAlimentacao.toFixed(2)}</td>
          <td>R$ ${f.inss.toFixed(2)}</td>
          <td>R$ ${f.salarioFamilia.toFixed(2)}</td>
          <td>R$ ${f.salarioTotal.toFixed(2)}</td>
          <td>R$ ${f.descontosTotal.toFixed(2)}</td>
        </tr>
      `;
        }

        html += '</tbody></table>';
        document.getElementById('tabela-container').innerHTML = html;
    }
</script>

</body>
</html>
